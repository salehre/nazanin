<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i need u</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="pixel-bg" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <main class="container">
      <div class="card">
        <!-- dinkie pixel heart icon -->
        <div class="pixel-icon" aria-hidden="true">
          <svg
            width="32"
            height="32"
            viewBox="0 0 11 10"
            xmlns="http://www.w3.org/2000/svg"
            shape-rendering="crispEdges"
          >
            <rect x="1" y="0" width="3" height="1" fill="currentColor" />
            <rect x="7" y="0" width="3" height="1" fill="currentColor" />
            <rect x="0" y="1" width="4" height="1" fill="currentColor" />
            <rect x="7" y="1" width="4" height="1" fill="currentColor" />
            <rect x="0" y="2" width="11" height="1" fill="currentColor" />
            <rect x="0" y="3" width="11" height="1" fill="currentColor" />
            <rect x="1" y="4" width="9" height="1" fill="currentColor" />
            <rect x="1" y="5" width="9" height="1" fill="currentColor" />
            <rect x="2" y="6" width="7" height="1" fill="currentColor" />
            <rect x="3" y="7" width="5" height="1" fill="currentColor" />
            <rect x="4" y="8" width="3" height="1" fill="currentColor" />
            <rect x="5" y="9" width="1" height="1" fill="currentColor" />
          </svg>
        </div>

        <h1 class="question">may you be my girl, nazanin?</h1>
        <p class="subtext">i promise it'll be worth it</p>

        <div class="buttons" id="btnArea">
          <button class="btn btn-yes pixel-btn" id="yesBtn">YES ^^</button>
          <button class="btn btn-no pixel-btn" id="noBtn">no :(</button>
        </div>

        <p class="no-counter" id="noCounter"></p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
